name: Build and publish platform installers
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.1.0
  push:
    tags:
      - "v*"
permissions:
  contents: read

env:
  # Native shells (Capacitor and Tauri) load the app from a local origin, so the
  # API base must be absolute. Relative paths caused endless loading screens.
  VITE_API_URL: https://www.comihub.top

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/comix-web build
      - name: Exclude installer binaries from the Android app bundle
        run: |
          rm -f artifacts/comix-web/dist/public/ComiHub-android.apk
          rm -rf artifacts/comix-web/dist/public/installers
          rm -rf artifacts/comix-web/dist/public/native-updates
      - run: pnpm --filter @workspace/comix-web exec cap sync android
      - run: ./gradlew assembleDebug
        working-directory: artifacts/comix-web/android
      - run: cp artifacts/comix-web/android/app/build/outputs/apk/debug/app-debug.apk ComiHub-android.apk
      - name: Verify the Android APK does not contain nested installers
        run: |
          if unzip -Z1 ComiHub-android.apk | grep -Eq '^assets/public/(ComiHub-android\.apk|installers/|native-updates/)'; then
            echo "Android bundle unexpectedly contains installer or OTA files."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-installer
          path: ComiHub-android.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: artifacts/comix-web
      - run: pnpm exec tauri build --bundles nsis
        working-directory: artifacts/comix-web
      - shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/comix-web/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce a Windows NSIS installer.' }
          Copy-Item $installer.FullName ComiHub-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ComiHub-windows-x64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libfuse2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        working-directory: artifacts/comix-web
      # The .deb links against the system web stack, so it stays small enough to
      # ship from the ComiHub domain. The AppImage bundles its own libraries and
      # is only attached to the GitHub release.
      - name: Build Linux deb package
        run: pnpm exec tauri build --bundles deb
        working-directory: artifacts/comix-web
      - name: Build Linux AppImage (best effort)
        continue-on-error: true
        run: pnpm exec tauri build --bundles appimage
        working-directory: artifacts/comix-web
      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          cp artifacts/comix-web/src-tauri/target/release/bundle/deb/*.deb ComiHub-linux-x64.deb
          ls -l ComiHub-linux-x64.deb
          if ls artifacts/comix-web/src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            cp artifacts/comix-web/src-tauri/target/release/bundle/appimage/*.AppImage ComiHub-linux-x64.AppImage
            ls -l ComiHub-linux-x64.AppImage
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            ComiHub-linux-x64.deb
            ComiHub-linux-x64.AppImage
          if-no-files-found: warn

  ios:
    name: iOS sideload IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/comix-web build
      - run: pnpm --filter @workspace/comix-web exec cap sync ios
      - name: Build unsigned iOS app for sideloading
        run: |
          xcodebuild \
            -project artifacts/comix-web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/ComiHub.app"
          # ditto preserves the executable/resource metadata expected by iOS
          # sideloaders more reliably than a generic zip invocation.
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/ComiHub-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sideload-ipa
          path: ComiHub-ios.ipa
          if-no-files-found: error

  # The install page downloads from the ComiHub domain, so a successful build has
  # to land in the repository itself. Release assets on a private repository are
  # not downloadable by signed-out visitors, which produced 404 pages on phones.
  publish:
    name: Publish installers to comihub.top
    needs: [android, windows, linux, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: ${{ needs.ios.result == 'success' }}
        with:
          name: ios-sideload-ipa
          path: staged
      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: windows-installer
          path: staged
      - uses: actions/download-artifact@v4
        if: ${{ needs.linux.result == 'success' }}
        with:
          name: linux-installer
          path: staged
      - uses: actions/download-artifact@v4
        with:
          name: android-installer
          path: staged
      - name: Copy installers into the web app
        run: |
          set -euo pipefail
          mkdir -p artifacts/comix-web/public/installers
          if [ -f staged/ComiHub-android.apk ]; then
            cp staged/ComiHub-android.apk artifacts/comix-web/public/ComiHub-android.apk
          fi
          # GitHub rejects pushes containing files over 100 MB. Anything larger
          # stays on the GitHub release only, and the install page reports the
          # platform as unavailable instead of linking to a dead file.
          for asset in ComiHub-ios.ipa ComiHub-windows-x64-setup.exe ComiHub-linux-x64.deb ComiHub-linux-x64.AppImage; do
            if [ -f "staged/$asset" ]; then
              size=$(stat -c %s "staged/$asset")
              if [ "$size" -gt 95000000 ]; then
                echo "Skipping $asset ($size bytes) because it exceeds the repository file size limit."
                continue
              fi
              cp "staged/$asset" "artifacts/comix-web/public/installers/$asset"
            fi
          done
          # Remove installers for platforms that did not produce a fresh build so
          # the page never serves a stale binary from an older release.
          find artifacts/comix-web/public/installers -type f | while read -r file; do
            base=$(basename "$file")
            if [ ! -f "staged/$base" ]; then
              echo "Removing stale installer $base"
              rm -f "$file"
            fi
          done
          ls -la artifacts/comix-web/public/installers
      - name: Publish the native release manifest
        run: |
          set -euo pipefail
          gradle_file=artifacts/comix-web/android/app/build.gradle
          version_code=$(grep -oP 'versionCode\s+\K[0-9]+' "$gradle_file" | head -1)
          version_name=$(grep -oP 'versionName\s+"\K[^"]+' "$gradle_file" | head -1)
          if [ -z "$version_code" ] || [ -z "$version_name" ]; then
            echo "Could not read the Android version from $gradle_file"
            exit 1
          fi
          mkdir -p artifacts/comix-web/public/native-updates
          cat > artifacts/comix-web/public/native-updates/native-release.json <<JSON
          {
            "versionCode": ${version_code},
            "versionName": "${version_name}",
            "androidUrl": "https://www.comihub.top/ComiHub-android.apk",
            "iosUrl": "https://www.comihub.top/installers/ComiHub-ios.ipa",
            "releasedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat artifacts/comix-web/public/native-updates/native-release.json
      - name: Commit and push the refreshed installers
        run: |
          set -euo pipefail
          git config user.name "ComiHub release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -f artifacts/comix-web/public/ComiHub-android.apk artifacts/comix-web/public/installers artifacts/comix-web/public/native-updates
          if git diff --staged --quiet; then
            echo "Installers already up to date."
            exit 0
          fi
          git commit -m "Publish platform installers ${{ inputs.tag || github.ref_name }}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  release:
    name: Publish release assets
    needs: [android, windows, linux, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.android.result == 'success' }}
        with:
          name: android-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ needs.linux.result == 'success' }}
        with:
          name: linux-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        if: ${{ needs.ios.result == 'success' }}
        with:
          name: ios-sideload-ipa
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: main
          name: ComiHub ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          overwrite_files: true
