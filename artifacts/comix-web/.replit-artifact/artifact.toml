kind = "web"
previewPath = "/"
title = "Comix Lounge"
version = "1.0.0"
id = "artifacts/comix-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19597

[services.development]
run = "pnpm --filter @workspace/comix-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/comix-web", "run", "build" ]
publicDir = "artifacts/comix-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19597"
BASE_PATH = "/"
