  <body>
    <div id="root"></div>
    <noscript>
      <h1>ComiHub — Manga &amp; Manhwa Reader</h1>
      <p>ComiHub is a free online manga and manhwa reader. Discover titles from multiple sources, save your library, and read offline.</p>
      <h2>Features</h2>
      <ul>
        <li>Browse and search manga and manhwa from multiple sources</li>
        <li>Save titles to your personal library</li>
        <li>Read chapters offline with downloaded content</li>
        <li>Track your reading history and stats</li>
        <li>Browse by category and genre</li>
        <li>Get notified about new chapter updates</li>
      </ul>
      <h2>Pages</h2>
      <ul>
        <li><a href="/">Home</a> — Discover trending and popular manga</li>
        <li><a href="/search">Search</a> — Find manga and manhwa by title</li>
        <li><a href="/sources">Sources</a> — Browse available manga sources</li>
        <li><a href="/categories">Categories</a> — Browse manga by genre and category</li>
        <li><a href="/library">Library</a> — Your saved manga collection</li>
        <li><a href="/history">History</a> — Your reading history</li>
        <li><a href="/updates">Updates</a> — Latest chapter updates</li>
      </ul>
      <p>ComiHub is a progressive web app (PWA) that works on desktop and mobile. Install it to your home screen for a native app experience.</p>
    </noscript>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "applicationCategory": "EntertainmentApplication",

    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
