[package]
name = "comihub-rust-scraper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "comihub-parser"
path = "src/main.rs"

[dependencies]
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
