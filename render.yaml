# Render Blueprint for the standalone main backend.
# Optional local bypass support can be enabled separately with BYPASS_SERVER_URL.
services:
  - type: web
    name: comihub-backend
    runtime: node
    rootDir: artifacts/api-server
    buildCommand: pnpm install && bash scripts/build-rust-parser.sh && pnpm run build
    startCommand: node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Render generates and persists this value; never commit a literal secret.
      - key: SESSION_SECRET
        generateValue: true
